<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Eventos - Cultura</title>

    <link rel="stylesheet" href="./global.css" />
    <link rel="stylesheet" href="./index.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&display=swap" />
</head>
<body class="dashboard-layout">

    <!-- NAVEGACIÓN SUPERIOR E LATERAL -->
    <div class="layout-navigation">
        <!-- Barra Lateral -->
        <aside class="sidebar">
            <nav class="sidebar__nav">
                <a href="#" class="sidebar__item">
                    <img class="icon" alt="Panel" src="./public/icon.svg" />
                    <span>Panel</span>
                </a>
                <a href="#" class="sidebar__item sidebar__item--active">
                    <img class="icon" alt="Eventos" src="./public/icon-1.svg" />
                    <span>Eventos</span>
                </a>
                <a href="#" class="sidebar__item">
                    <img class="icon" alt="Reportes" src="./public/icon-2.svg" />
                    <span>Reportes</span>
                </a>
                <a href="#" class="sidebar__item">
                    <img class="icon" alt="Asistentes" src="./public/icon-3.svg" />
                    <span>Asistentes</span>
                </a>
            </nav>
        </aside>

        <!-- Barra Superior -->
        <header class="topbar">
            <div class="topbar__brand">
                <span class="topbar__logo-text">CULTURA</span>
                <img class="topbar__logo-img" alt="Logo Cultura" src="./public/mask-group@2d.png" />
            </div>

            <div class="topbar__actions">
                <button type="button" class="topbar__action-btn">
                    <img class="icon" alt="" src="./public/icon-4.svg" />
                    <span>Notificaciones</span>
                </button>

                <button type="button" class="topbar__action-btn">
                    <img class="icon" alt="" src="./public/icon-5.svg" />
                    <span>Configuración</span>
                </button>

                <!-- Menú Usuario -->
                <div class="user-dropdown">
                    <div class="avatar">
                        <img class="avatar__image" alt="Avatar del usuario" src="./public/image@2x.png" />
                    </div>
                    <div class="user-dropdown__info">
                        <span class="user-dropdown__name">Admin</span>
                        <span class="user-dropdown__role">Organizador</span>
                    </div>
                    <img class="icon icon--chevron" alt="" src="./public/icon--chevron-down.svg" />
                </div>
            </div>
        </header>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">
        
        <!-- ENCABEZADO Y BOTÓN DE ACCIÓN -->
        <header class="page-header">
            <div class="page-header__title-group">
                <h1 class="page-header__title">Gestión de Eventos</h1>
                <p class="page-header__subtitle">Administra, crea y edita tus eventos culturales desde un solo lugar.</p>
            </div>

            <button type="button" class="btn btn--primary" id="btnNuevoEvento">
                <img class="btn__icon" alt="" src="./public/icon-6.svg" />
                <span>Nuevo evento</span>
            </button>
        </header>

        <!-- BARRA DE FILTROS Y BÚSQUEDA -->
        <section class="filters-bar">
            <div class="search-box">
                <input type="search" class="search-box__input" placeholder="Buscar evento..." />
            </div>

            <div class="filter-dropdown">
                <select class="filter-dropdown__select" aria-label="Filtrar por estado">
                    <option value="">Todos los estados</option>
                    <option value="publicado">Publicado</option>
                    <option value="borrador">Borrador</option>
                    <option value="cancelado">Cancelado</option>
                </select>
                <img class="icon" alt="" src="./public/icon-7.svg" />
            </div>

            <div class="filter-dropdown">
                <select class="filter-dropdown__select" aria-label="Filtrar por categoría">
                    <option value="">Todas las categorías</option>
                    <option value="danza">Danza</option>
                    <option value="teatro">Teatro</option>
                    <option value="musica">Música</option>
                    <option value="artes">Artes Plásticas</option>
                </select>
                <img class="icon" alt="" src="./public/icon-8.svg" />
            </div>
        </section>

        <!-- TABLA DE EVENTOS -->
        <section class="table-container">
            <table class="events-table">
                <thead>
                    <tr>
                        <th scope="col">Nombre del evento</th>
                        <th scope="col">Categoría</th>
                        <th scope="col">Fecha y hora</th>
                        <th scope="col">Ubicación</th>
                        <th scope="col">Estado</th>
                        <th scope="col">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Filas dinámicas generadas desde JS o Backend -->
                </tbody>
            </table>
        </section>

    </main>

    <!-- VENTANA EMERGENTE (MODAL) -->
    <div id="modalFormulario" class="modal-overlay" aria-hidden="true">
        <div class="modal-content" role="dialog" aria-labelledby="modalTitle">
            <h2 id="modalTitle" class="modal-content__title">Crear Nuevo Evento</h2>
            
            <form id="formEvento" class="modal-form">
                <div class="form-group">
                    <label for="titulo">Nombre del evento</label>
                    <input type="text" id="titulo" class="form-control" required placeholder="Ej. Festival de Danza Folklórica" />
                </div>

                <div class="form-group">
                    <label for="categoria">Categoría</label>
                    <select id="categoria" class="form-control" required>
                        <option value="">Selecciona una categoría</option>
                        <option value="danza">Danza</option>
                        <option value="teatro">Teatro</option>
                        <option value="musica">Música</option>
                        <option value="artes">Artes Plásticas</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="fecha">Fecha y hora</label>
                    <input type="datetime-local" id="fecha" class="form-control" required />
                </div>

                <div class="form-group">
                    <label for="ubicacion">Ubicación</label>
                    <input type="text" id="ubicacion" class="form-control" required placeholder="Ej. Teatro Principal" />
                </div>

                <div class="form-group">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" class="form-control" rows="3" placeholder="Detalles sobre el evento..."></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn--secondary" id="btnCerrar">Cancelar</button>
                    <button type="submit" class="btn btn--primary">Guardar Evento</button>
                </div>
            </form>
        </div>
    </div>

    <!-- LÓGICA JAVASCRIPT -->
    <script>
        const btnNuevoEvento = document.getElementById('btnNuevoEvento');
        const modal = document.getElementById('modalFormulario');
        const btnCerrar = document.getElementById('btnCerrar');
        const formEvento = document.getElementById('formEvento');

        // Abrir modal
        btnNuevoEvento.addEventListener('click', () => {
            modal.style.display = 'flex';
            modal.setAttribute('aria-hidden', 'false');
        });

        // Cerrar modal al cancelar
        btnCerrar.addEventListener('click', () => {
            modal.style.display = 'none';
            modal.setAttribute('aria-hidden', 'true');
        });

        // Cerrar modal al hacer clic en el fondo
        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
                modal.setAttribute('aria-hidden', 'true');
            }
        });

        // Guardar datos
        formEvento.addEventListener('submit', (e) => {
            e.preventDefault();
            alert('¡Evento creado exitosamente!');
            modal.style.display = 'none';
            modal.setAttribute('aria-hidden', 'true');
            formEvento.reset();
        });
    </script>
</body>
</html>
